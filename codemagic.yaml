workflows:
  android-workflow:
    name: Android Workflow
    environment:
      flutter: stable
    scripts:
      - unset JAVA_TOOL_OPTIONS
      - unset _JAVA_OPTIONS
      - unset JAVA_OPTS
      - unset GRADLE_OPTS
      - flutter pub get
      - echo "JAVA:"
      - env | grep -i java
      - echo "GRADLE:"
      - env | grep -i gradle
      - cat android/gradle.properties
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
